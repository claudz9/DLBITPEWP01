<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">Finance Dashboard</h1>
        <nav class="mt-8 flex-1 space-y-2">
            <a href="index.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Dashboard
                Overview</a>
            <a href="transactions.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Transactions</a>
            <a href="analytics.html"
                class="block px-4 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium">Analytics</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between items-center shadow-sm">
            <h2 class="text-xl font-semibold">Financial Analytics</h2>
        </header>

        <!-- Charts Grid Container -->
        <div class="p-6 max-w-7xl mx-auto w-full space-y-6">

            <!-- Top Row: Bar Chart (Full Width) -->
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <h3 class="text-lg font-semibold mb-4 text-gray-700">Monthly Income vs. Expenses</h3>
                <canvas id="barChart" height="80"></canvas>
            </div>

            <!-- Bottom Row: Line Chart and Pie Chart -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Line Chart -->
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="text-lg font-semibold mb-4 text-gray-700">Spending Trends Over Time</h3>
                    <canvas id="lineChart" height="200"></canvas>
                </div>

                <!-- Pie Chart -->
                <div class="bg-white p-6 rounded-xl border shadow-sm flex flex-col items-center">
                    <h3 class="text-lg font-semibold mb-4 text-gray-700 w-full text-left">Expenses by Category</h3>
                    <div class="w-full max-w-md">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Dependencies -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        $(document).ready(function () {

            // Helper function to format currency in tooltips and axes
            const currencyFormatter = (value) => {
                return '€' + parseFloat(value).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            };

            // Common Tooltip Configuration for clarity
            const tooltipConfig = {
                callbacks: {
                    label: function (context) {
                        let label = context.dataset.label || '';
                        if (label) { label += ': '; }
                        const value = typeof context.parsed === 'object' ? context.parsed.y : context.parsed;
                        label += currencyFormatter(value);
                        return label;
                    }
                }
            };

            // 1. Fetch Monthly Data for Bar and Line Charts
            fetch('/api/summary/monthly')
                .then(response => response.json())
                .then(data => {
                    const months = data.map(row => row.month);
                    const incomes = data.map(row => parseFloat(row.income));
                    const expenses = data.map(row => parseFloat(row.expense));

                    // --- BAR CHART (Income vs Expense) ---
                    new Chart(document.getElementById('barChart').getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: months,
                            datasets: [
                                {
                                    label: 'Income',
                                    data: incomes,
                                    backgroundColor: 'rgba(16, 185, 129, 0.8)', // Green
                                    borderRadius: 4
                                },
                                {
                                    label: 'Expenses',
                                    data: expenses,
                                    backgroundColor: 'rgba(239, 68, 68, 0.8)', // Red
                                    borderRadius: 4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            plugins: { tooltip: tooltipConfig },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { callback: currencyFormatter }
                                }
                            }
                        }
                    });

                    // --- LINE CHART (Spending Trends) ---
                    new Chart(document.getElementById('lineChart').getContext('2d'), {
                        type: 'line',
                        data: {
                            labels: months,
                            datasets: [{
                                label: 'Total Expenses',
                                data: expenses,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.3,
                                pointBackgroundColor: '#ef4444'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { tooltip: tooltipConfig },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { callback: currencyFormatter }
                                }
                            }
                        }
                    });
                })
                .catch(err => console.error('Error loading monthly data:', err));

            // 2. Fetch Category Data for Pie Chart
            fetch('/api/summary/categories')
                .then(response => response.json())
                .then(data => {
                    new Chart(document.getElementById('pieChart').getContext('2d'), {
                        type: 'pie', // Changed from doughnut to pie per requirements
                        data: {
                            labels: data.map(row => row.category),
                            datasets: [{
                                data: data.map(row => parseFloat(row.total)),
                                backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#6366f1', '#8b5cf6'],
                                borderAlign: 'inner'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                tooltip: tooltipConfig,
                                legend: { position: 'right' }
                            }
                        }
                    });
                })
                .catch(err => console.error('Error loading category data:', err));
        });
    </script>
</body>

</html>
