<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Left-hand navigation panel -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">Finance Dashboard</h1>
    </aside>

    <!-- Main area for the dashboard overview -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between">
            <h2 class="text-xl font-semibold">Overview</h2>
        </header>

        <!-- Main dashboard content area -->
        <div id="dashboard-content" class="p-6 space-y-6 max-w-7xl mx-auto w-full">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm">Total Balance: €24,500.00</div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">Income: €8,200.00</div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">Expenses: €3,150.00</div>
            </div>
            <!-- Charts for the financial overview -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm lg:col-span-2">
                    <canvas id="cashFlowChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <!-- Recent transactions list -->
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <table id="transactionsTable" class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                            <th class="p-3">Date</th>
                            <th class="p-3">Merchant</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </main>

    <!-- Third-party libraries used by the dashboard -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Line chart showing how the balance changes over time.
        const cashFlowCtx = document.getElementById('cashFlowChart').getContext('2d');
        new Chart(cashFlowCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Net Balance',
                    data: [1200, 1900, 1500, 2200, 1800, 2500],
                    borderColor: '#3b82f6', // Tailwind blue-500
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4 // Creates smooth curves
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });

        // Doughnut chart showing how spending is split across categories.
        const categoryCtx = document.getElementById('categoryChart').getContext('2d');
        new Chart(categoryCtx, {
            type: 'doughnut',
            data: {
                labels: ['Housing', 'Food', 'Transport', 'Utilities'],
                datasets: [{
                    data: [1200, 600, 300, 250],
                    backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#6366f1'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                cutout: '70%', // Makes it a thin doughnut
                plugins: { legend: { position: 'bottom' } }
            }
        });

        // Data table that loads transaction data from the backend API.
        $(document).ready(function () {
            $('#transactionsTable').DataTable({
                ajax: {
                    url: 'http://localhost:3000/api/transactions', // Use the absolute backend URL so the table can fetch live data.
                    error: function (xhr) {
                        console.error('Transactions API failed:', xhr.status, xhr.responseText);
                    }
                },
                pageLength: 5,
                lengthChange: false,
                order: [[0, 'desc']], // Show the newest transactions first.
                columns: [
                    {
                        data: 'date',
                        render: function (data) {
                            return new Date(data).toLocaleDateString(); // Convert the raw date into something readable.
                        }
                    },
                    { data: 'merchant' },
                    { data: 'category' },
                    {
                        data: 'amount',
                        render: function (data) {
                            return '€' + parseFloat(data).toFixed(2); // Format the amount in euros.
                        }
                    },
                    {
                        data: 'status',
                        render: function (data) {
                            // Give each transaction status a matching badge color.
                            const colorClass = data === 'cleared' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                            return `<span class="px-2 py-1 rounded-full text-xs font-medium ${colorClass}">${data}</span>`;
                        }
                    }
                ]
            });
        });
    </script>
</body>

</html>
