<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        .dataTables_wrapper .dataTables_filter input,
        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.375rem 0.75rem;
            margin-bottom: 1.25rem;
            margin-left: 0.5rem;
            outline: none;
            background-color: #f9fafb;
        }

        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        table.dataTable tbody tr {
            border-bottom: 1px solid #f3f4f6 !important;
            transition: background-color 0.2s ease-in-out;
        }

        table.dataTable tbody tr:hover {
            background-color: #f8fafc !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 0.5rem !important;
            border: 1px solid #e5e7eb !important;
            background: white !important;
            margin-left: 0.375rem;
            padding: 0.375rem 0.75rem !important;
            color: #374151 !important;
            transition: all 0.2s;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background: #f3f4f6 !important;
            color: #111827 !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #eff6ff !important;
            border-color: #3b82f6 !important;
            color: #1d4ed8 !important;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- This is the sidebar on the left -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">Finance Dashboard</h1>
        <nav class="mt-8 flex-1 space-y-2">
            <a href="index.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Dashboard
                Overview</a>
            <a href="transactions.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Transactions</a>
            <a href="analytics.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Analytics</a>
        </nav>
    </aside>

    <!-- This is the main section where the dashboard content sits -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between">
            <h2 class="text-xl font-semibold">Overview</h2>
        </header>

        <!-- The main dashboard area where the cards, charts, and table live -->
        <div id="dashboard-content" class="p-6 space-y-6 max-w-7xl mx-auto w-full">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div
                    class="bg-white p-6 rounded-xl border shadow-sm hover:shadow-md transition-all duration-300 transform hover:-translate-y-1">
                    <p class="text-sm text-gray-500 mb-1 font-medium">Total Balance</p>
                    <h3 id="kpi-balance" class="text-3xl font-bold text-gray-800">€0.00</h3>
                </div>
                <div
                    class="bg-white p-6 rounded-xl border shadow-sm hover:shadow-md transition-all duration-300 transform hover:-translate-y-1">
                    <p class="text-sm text-gray-500 mb-1 font-medium">Monthly Income</p>
                    <h3 id="kpi-income" class="text-3xl font-bold text-green-600">+€0.00</h3>
                </div>
                <div
                    class="bg-white p-6 rounded-xl border shadow-sm hover:shadow-md transition-all duration-300 transform hover:-translate-y-1">
                    <p class="text-sm text-gray-500 mb-1 font-medium">Monthly Expenses</p>
                    <h3 id="kpi-expenses" class="text-3xl font-bold text-red-500">-€0.00</h3>
                </div>
            </div>
            <!-- These charts give a quick view of money coming in and going out -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm lg:col-span-2">
                    <canvas id="cashFlowChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- Active Budgets Section -->
            <div class="bg-white p-6 rounded-2xl shadow border border-gray-100 mb-8 mt-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-900">Active Budgets</h3>
                    <button onclick="openBudgetModal()"
                        class="text-sm bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-medium hover:bg-blue-100 transition-all">
                        + Set New Budget
                    </button>
                </div>


                <div id="budgetList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <p class="text-sm text-gray-500">Loading budgets...</p>
                </div>
            </div>

            <!-- This is the table showing recent transactions -->
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <table id="transactionsTable" class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                            <th class="p-3">Date</th>
                            <th class="p-3">Merchant</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </main>

    <!-- These are the library files the dashboard needs to work -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        $(document).ready(function () {

            // Show monthly cash flow.
            fetch('/api/summary/cashflow')
                .then(response => response.json())
                .then(data => {
                    const cashFlowCtx = document.getElementById('cashFlowChart').getContext('2d');
                    new Chart(cashFlowCtx, {
                        type: 'line',
                        data: {
                            labels: data.map(row => row.month),
                            datasets: [{
                                label: 'Net Balance',
                                data: data.map(row => parseFloat(row.net_balance)),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true } }
                        }
                    });
                })
                .catch(err => console.error('Error loading cash flow data:', err));

            // Show spending by category.
            fetch('/api/summary/categories')
                .then(response => response.json())
                .then(data => {
                    const categoryCtx = document.getElementById('categoryChart').getContext('2d');
                    new Chart(categoryCtx, {
                        type: 'doughnut',
                        data: {
                            labels: data.map(row => row.category),
                            datasets: [{
                                data: data.map(row => parseFloat(row.total)),
                                backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#6366f1', '#8b5cf6'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            cutout: '70%',
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                })
                .catch(err => console.error('Error loading category data:', err));

            // Fill in the summary cards.
            fetch('/api/summary/kpi')
                .then(response => response.json())
                .then(data => {
                    const formatCurrency = (val) => parseFloat(val || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    document.getElementById('kpi-balance').innerText = '€' + formatCurrency(data.total_balance);
                    document.getElementById('kpi-income').innerText = '+€' + formatCurrency(data.monthly_income);
                    document.getElementById('kpi-expenses').innerText = '-€' + formatCurrency(data.monthly_expenses);
                })
                .catch(err => console.error('Error loading KPIs:', err));

            // Load the recent transactions table.
            $('#transactionsTable').DataTable({
                ajax: {
                    url: '/api/transactions', // Use the API on this server.
                    error: function (xhr) {
                        console.error('Transactions API failed:', xhr.status, xhr.responseText);
                    }
                },
                pageLength: 5,
                lengthChange: false,
                order: [[0, 'desc']],
                columns: [
                    {
                        data: 'date',
                        render: function (data) {
                            return new Date(data).toLocaleDateString();
                        }
                    },
                    { data: 'merchant' },
                    { data: 'category' },
                    {
                        data: 'amount',
                        render: function (data) {
                            return '€' + parseFloat(data).toFixed(2);
                        }
                    },
                    {
                        data: 'status',
                        render: function (data) {
                            const colorClass = data === 'cleared' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                            return `<span class="px-2 py-1 rounded-full text-xs font-medium ${colorClass}">${data}</span>`;
                        }
                    }
                ]
            });
        });

        // --- Budget UI Logic ---
        function openBudgetModal() { document.getElementById('budgetModal').classList.remove('hidden'); }
        function closeBudgetModal() { document.getElementById('budgetModal').classList.add('hidden'); }

        async function loadBudgetCategories() {
            const categorySelect = document.getElementById('budgetCategory');

            try {
                const response = await fetch('/api/budget-categories');
                if (!response.ok) throw new Error(`Category request failed: ${response.status}`);

                const categories = await response.json();
                categorySelect.replaceChildren(new Option('Select a category', ''));
                categories.forEach(category => {
                    categorySelect.add(new Option(category.name, category.id));
                });
            } catch (err) {
                console.error('Failed to load budget categories', err);
                categorySelect.replaceChildren(new Option('Unable to load categories', ''));
                categorySelect.disabled = true;
            }
        }

        // Fetch and display budgets
        async function fetchBudgets() {
            try {
                const response = await fetch('/api/budgets');
                const budgets = await response.json();
                const list = document.getElementById('budgetList');
                list.innerHTML = '';

                if (budgets.length === 0) {
                    list.innerHTML = '<p class="text-sm text-gray-500 col-span-full">No active budgets set.</p>';
                    return;
                }

                budgets.forEach(b => {
                    list.innerHTML += `
                <div class="flex justify-between items-center p-4 bg-slate-50 rounded-xl border border-slate-200 shadow-sm">
                    <div>
                        <p class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-1">${b.period}</p>
                        <p class="font-medium text-gray-800">${b.category || 'Uncategorized'}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-lg font-bold text-gray-900">€${parseFloat(b.amount).toFixed(2)}</span>
                    </div>
                </div>
            `;
                });
            } catch (err) {
                console.error('Failed to load budgets', err);
                document.getElementById('budgetList').innerHTML = '<p class="text-sm text-red-500">Error loading budgets.</p>';
            }
        }

        // Wait for the HTML to fully load before attaching the submit event
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Load budgets immediately
            fetchBudgets();
            loadBudgetCategories();

            // 2. Safely attach the form listener
            const budgetForm = document.getElementById('budgetForm');
            if (budgetForm) {
                budgetForm.addEventListener('submit', async (e) => {
                    e.preventDefault(); // This stops the '?' page refresh!

                    const amount = document.getElementById('budgetAmount').value;
                    const period = document.getElementById('budgetPeriod').value;
                    const category_id = document.getElementById('budgetCategory').value;

                    try {
                        const response = await fetch('/api/budgets', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ amount, period, category_id })
                        });

                        if (response.ok) {
                            closeBudgetModal();
                            budgetForm.reset();
                            fetchBudgets();
                        }
                    } catch (err) {
                        console.error('Failed to save budget', err);
                        alert('Failed to save budget. Check console for details.');
                    }
                });
            }
        });

    </script>
    <!-- Add Budget Modal -->
    <div id="budgetModal"
        class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <h3 class="text-xl font-bold mb-6 text-gray-900">Set New Budget</h3>

            <form id="budgetForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (€)</label>
                    <input type="number" id="budgetAmount" required step="0.01"
                        class="block w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Period</label>
                    <select id="budgetPeriod" required
                        class="block w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        <option value="monthly">Monthly</option>
                        <option value="weekly">Weekly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="budgetCategory" required
                        class="block w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                        <option value="">Loading categories...</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeBudgetModal()"
                        class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors font-medium">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors font-medium">Save
                        Budget</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
