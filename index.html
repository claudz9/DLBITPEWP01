<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- This is the sidebar on the left -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">Finance Dashboard</h1>
        <nav class="mt-8 flex-1 space-y-2">
            <a href="index.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Dashboard
                Overview</a>
            <a href="transactions.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Transactions</a>
            <a href="analytics.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Analytics</a>
        </nav>
    </aside>

    <!-- This is the main section where the dashboard content sits -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between">
            <h2 class="text-xl font-semibold">Overview</h2>
        </header>

        <!-- The main dashboard area where the cards, charts, and table live -->
        <div id="dashboard-content" class="p-6 space-y-6 max-w-7xl mx-auto w-full">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <p class="text-sm text-gray-500 mb-1">Total Balance</p>
                    <h3 id="kpi-balance" class="text-3xl font-bold">€0.00</h3>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <p class="text-sm text-gray-500 mb-1">Monthly Income</p>
                    <h3 id="kpi-income" class="text-3xl font-bold text-green-600">+€0.00</h3>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <p class="text-sm text-gray-500 mb-1">Monthly Expenses</p>
                    <h3 id="kpi-expenses" class="text-3xl font-bold text-red-500">-€0.00</h3>
                </div>
            </div>
            <!-- These charts give a quick view of money coming in and going out -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm lg:col-span-2">
                    <canvas id="cashFlowChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <!-- This is the table showing recent transactions -->
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <table id="transactionsTable" class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                            <th class="p-3">Date</th>
                            <th class="p-3">Merchant</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </main>

    <!-- These are the library files the dashboard needs to work -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        $(document).ready(function () {

            // 1. Chart.js: Cash Flow Line Chart
            fetch('/api/summary/cashflow')
                .then(response => response.json())
                .then(data => {
                    const cashFlowCtx = document.getElementById('cashFlowChart').getContext('2d');
                    new Chart(cashFlowCtx, {
                        type: 'line',
                        data: {
                            labels: data.map(row => row.month),
                            datasets: [{
                                label: 'Net Balance',
                                data: data.map(row => parseFloat(row.net_balance)),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true } }
                        }
                    });
                })
                .catch(err => console.error('Error loading cash flow data:', err));

            // 2. Chart.js: Category Spending Doughnut Chart
            fetch('/api/summary/categories')
                .then(response => response.json())
                .then(data => {
                    const categoryCtx = document.getElementById('categoryChart').getContext('2d');
                    new Chart(categoryCtx, {
                        type: 'doughnut',
                        data: {
                            labels: data.map(row => row.category),
                            datasets: [{
                                data: data.map(row => parseFloat(row.total)),
                                backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#6366f1', '#8b5cf6'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            cutout: '70%',
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                })
                .catch(err => console.error('Error loading category data:', err));

            // 3. Load KPI Cards
            fetch('/api/summary/kpi')
                .then(response => response.json())
                .then(data => {
                    const formatCurrency = (val) => parseFloat(val || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    document.getElementById('kpi-balance').innerText = '€' + formatCurrency(data.total_balance);
                    document.getElementById('kpi-income').innerText = '+€' + formatCurrency(data.monthly_income);
                    document.getElementById('kpi-expenses').innerText = '-€' + formatCurrency(data.monthly_expenses);
                })
                .catch(err => console.error('Error loading KPIs:', err));

            // 4. DataTables.js: Transaction Ledger
            $('#transactionsTable').DataTable({
                ajax: {
                    url: '/api/transactions', // Switched to relative URL
                    error: function (xhr) {
                        console.error('Transactions API failed:', xhr.status, xhr.responseText);
                    }
                },
                pageLength: 5,
                lengthChange: false,
                order: [[0, 'desc']],
                columns: [
                    {
                        data: 'date',
                        render: function (data) {
                            return new Date(data).toLocaleDateString();
                        }
                    },
                    { data: 'merchant' },
                    { data: 'category' },
                    {
                        data: 'amount',
                        render: function (data) {
                            return '€' + parseFloat(data).toFixed(2);
                        }
                    },
                    {
                        data: 'status',
                        render: function (data) {
                            const colorClass = data === 'cleared' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                            return `<span class="px-2 py-1 rounded-full text-xs font-medium ${colorClass}">${data}</span>`;
                        }
                    }
                ]
            });
        });
    </script>
</body>

</html>
