<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">FinDash</h1>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between">
            <h2 class="text-xl font-semibold">Overview</h2>
        </header>

        <!-- Dashboard Grid Container -->
        <div id="dashboard-content" class="p-6 space-y-6 max-w-7xl mx-auto w-full">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm">Total Balance: €24,500.00</div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">Income: €8,200.00</div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">Expenses: €3,150.00</div>
            </div>
            <!-- Charts Section -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm lg:col-span-2">
                    <canvas id="cashFlowChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <!-- Transactions Table -->
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <table id="transactionsTable" class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 border-b">
                            <th class="p-3">Date</th>
                            <th class="p-3">Merchant</th>
                            <th class="p-3">Amount</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
