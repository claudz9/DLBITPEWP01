<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">Finance Dashboard</h1>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between">
            <h2 class="text-xl font-semibold">Overview</h2>
        </header>

        <!-- Dashboard Grid Container -->
        <div id="dashboard-content" class="p-6 space-y-6 max-w-7xl mx-auto w-full">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm">Total Balance: €24,500.00</div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">Income: €8,200.00</div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">Expenses: €3,150.00</div>
            </div>
            <!-- Charts Section -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm lg:col-span-2">
                    <canvas id="cashFlowChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <!-- Transactions Table -->
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <table id="transactionsTable" class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                            <th class="p-3">Date</th>
                            <th class="p-3">Merchant</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </main>
</body>\
<!-- dependencies -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // 1. Chart.js: Cash Flow Line Chart
    const cashFlowCtx = document.getElementById('cashFlowChart').getContext('2d');
    new Chart(cashFlowCtx, {
        type: 'line',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
            datasets: [{
                label: 'Net Balance',
                data: [1200, 1900, 1500, 2200, 1800, 2500],
                borderColor: '#3b82f6', // Tailwind blue-500
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.4 // Creates smooth curves
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
        }
    });
    // 2. Chart.js: Category Spending Doughnut Chart
    const categoryCtx = document.getElementById('categoryChart').getContext('2d');
    new Chart(categoryCtx, {
        type: 'doughnut',
        data: {
            labels: ['Housing', 'Food', 'Transport', 'Utilities'],
            datasets: [{
                data: [1200, 600, 300, 250],
                backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#6366f1'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            cutout: '70%', // Makes it a thin doughnut
            plugins: { legend: { position: 'bottom' } }
        }
    });
    // 3. DataTables.js: Transaction Ledger (Dynamic API Fetch)
    $(document).ready(function () {
        $('#transactionsTable').DataTable({
            ajax: 'http://localhost:3000/api/transactions', // Fetches JSON from your Express server
            pageLength: 5,
            lengthChange: false,
            order: [[0, 'desc']], // Sort by date descending by default
            columns: [
                {
                    data: 'date',
                    render: function (data) {
                        return new Date(data).toLocaleDateString(); // Format the timestamp
                    }
                },
                { data: 'merchant' },
                { data: 'category' },
                {
                    data: 'amount',
                    render: function (data) {
                        return '$' + parseFloat(data).toFixed(2);
                    }
                },
                {
                    data: 'status',
                    render: function (data) {
                        // Add Tailwind badge styling based on status
                        const colorClass = data === 'cleared' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                        return `<span class="px-2 py-1 rounded-full text-xs font-medium ${colorClass}">${data}</span>`;
                    }
                }
            ]
        });
    });
</script>


</html>
