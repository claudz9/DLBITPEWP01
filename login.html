<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
            <p class="text-sm text-gray-500 mt-2">Please sign in to your dashboard.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" required placeholder="student@test.com"
                    class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <!-- Error Message Container -->
            <div id="errorMsg" class="text-red-500 text-sm hidden font-medium text-center"></div>

            <button type="submit" id="loginBtn"
                class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 hover:shadow-lg focus:ring-4 focus:ring-blue-300 transition-all active:scale-95">
                Sign In
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', function (e) {
            e.preventDefault(); // Stop standard form submission

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Reset UI
            errorMsg.classList.add('hidden');
            loginBtn.innerHTML = 'Signing in...';
            loginBtn.disabled = true;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
                .then(response => {
                    if (!response.ok) throw new Error('Invalid email or password.');
                    return response.json();
                })
                .then(data => {
                    // Success: Save user info locally and redirect to the dashboard
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                })
                .catch(err => {
                    // Failure: Show error message
                    errorMsg.textContent = err.message;
                    errorMsg.classList.remove('hidden');
                })
                .finally(() => {
                    // Reset button state
                    loginBtn.innerHTML = 'Sign In';
                    loginBtn.disabled = false;
                });
        });
    </script>
</body>

</html>
