<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Force DataTables inputs to use Tailwind styling */
        .dataTables_wrapper .dataTables_filter input,
        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.375rem 0.75rem;
            margin-bottom: 1.25rem;
            margin-left: 0.5rem;
            outline: none;
            background-color: #f9fafb;
        }

        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Table Row Hover Effects */
        table.dataTable tbody tr {
            border-bottom: 1px solid #f3f4f6 !important;
            transition: background-color 0.2s ease-in-out;
        }

        table.dataTable tbody tr:hover {
            background-color: #f8fafc !important;
        }

        /* Pagination Button Styling */
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 0.5rem !important;
            border: 1px solid #e5e7eb !important;
            background: white !important;
            margin-left: 0.375rem;
            padding: 0.375rem 0.75rem !important;
            color: #374151 !important;
            transition: all 0.2s;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background: #f3f4f6 !important;
            color: #111827 !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #eff6ff !important;
            border-color: #3b82f6 !important;
            color: #1d4ed8 !important;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">Finance Dashboard</h1>
        <nav class="mt-8 flex-1 space-y-2">
            <a href="index.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Dashboard
                Overview</a>
            <a href="transactions.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Transactions</a>
            <a href="analytics.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Analytics</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between items-center shadow-sm">
            <h2 class="text-xl font-semibold">Transaction Ledger</h2>
            <button id="openModalBtn"
                class="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 hover:shadow-lg focus:ring-blue-300 focus:outline-none transition-all active:scale-95">
                + Add Transaction
            </button>
        </header>

        <!-- Full-Page Table Container -->
        <div class="p-6 max-w-7xl mx-auto w-full flex-1">
            <div class="bg-white p-6 rounded-xl border shadow-sm h-full">
                <div class="overflow-x-auto">
                    <table id="fullTransactionsTable" class="w-full text-left display">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-3">Date</th>
                                <th class="p-3">Description</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Account</th>
                                <th class="p-3">Amount</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data injected via DataTables AJAX -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add transaction modal -->
    <div id="transactionModal"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-all duration-300 opacity-0 scale-95">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md transform transition-all">
            <h3 class="text-xl font-semibold mb-4 text-gray-800">Add New Transaction</h3>

            <form id="addTransactionForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Date</label>
                    <input type="date" id="t-date" required
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Merchant</label>
                    <input type="text" id="t-merchant" required placeholder="e.g., Librería"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Amount (€)</label>
                    <input type="number" step="0.01" id="t-amount" required placeholder="0.00"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Account</label>
                        <select id="t-account"
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                            <option value="1">Main Checking</option>
                            <option value="2">Travel Rewards Visa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Category</label>
                        <select id="t-category"
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                            <option value="1">Auto & Transport</option>
                            <option value="2">Education</option>
                            <option value="3">Family & Baby</option>
                            <option value="5">Travel & Vacation</option>
                            <option value="7">Shopping & Electronics</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="closeModalBtn"
                        class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save
                        Transaction</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function () {
            $('#fullTransactionsTable').DataTable({
                ajax: {
                    url: '/api/transactions',
                    error: function (xhr) {
                        console.error('Transactions API failed:', xhr.status, xhr.responseText);
                    }
                },
                pageLength: 15, // Show more rows on the dedicated page
                lengthMenu: [10, 15, 25, 50, 100], // Allow user to change pagination size
                searching: true, // Enable the global search bar
                ordering: true, // Enable column sorting
                order: [[0, 'desc']], // Default sort: Date descending
                columns: [
                    {
                        data: 'date',
                        render: function (data) {
                            return new Date(data).toLocaleDateString();
                        }
                    },
                    { data: 'merchant' },
                    { data: 'category' },
                    { data: 'account' }, // Added account column for deeper analytics
                    {
                        data: 'amount',
                        render: function (data) {
                            return '€' + parseFloat(data).toFixed(2);
                        }
                    },
                    {
                        data: 'status',
                        render: function (data) {
                            const colorClass = data === 'cleared' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                            return `<span class="px-2 py-1 rounded-full text-xs font-medium ${colorClass}">${data}</span>`;
                        }
                    }
                ]
            });
        });

        // Handle the add-transaction form and update the table without reloading.

        const modal = document.getElementById('transactionModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const form = document.getElementById('addTransactionForm');

        // Open and close the form.
        openBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0', 'scale-95'), 10); // Slight delay triggers the CSS transition
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { modal.classList.add('hidden'); form.reset(); }, 300); // Wait for transition to finish before hiding
        });

        // Submit the transaction without reloading the page.
        form.addEventListener('submit', function (e) {
            e.preventDefault(); // CRITICAL: Stops the browser from refreshing the page

            // Build the request from the form values.
            const newTransaction = {
                date: document.getElementById('t-date').value,
                merchant: document.getElementById('t-merchant').value,
                amount: parseFloat(document.getElementById('t-amount').value),
                account_id: parseInt(document.getElementById('t-account').value),
                category_id: parseInt(document.getElementById('t-category').value),
                status: 'cleared'
            };

            // Send async POST request to the API
            fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newTransaction)
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    // Success Workflow:
                    modal.classList.add('hidden'); // Hide modal
                    form.reset(); // Clear form

                    // Refresh the table and keep the current page.
                    $('#fullTransactionsTable').DataTable().ajax.reload(null, false);
                })
                .catch(err => {
                    console.error('Error adding transaction via AJAX:', err);
                    alert('Failed to save transaction. Check the console.');
                });
        });
    </script>
</body>

</html>
