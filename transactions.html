<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        /* Tailwind fixes for DataTables default inputs */
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            padding: 0.25rem 0.5rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
        }

        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            padding: 0.25rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r hidden md:flex flex-col p-6">
        <h1 class="text-2xl font-bold text-blue-600">Finance Dashboard</h1>
        <nav class="mt-8 flex-1 space-y-2">
            <a href="index.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Dashboard
                Overview</a>
            <a href="transactions.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Transactions</a>
            <a href="analytics.html"
                class="block px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Analytics</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-6 flex justify-between items-center shadow-sm">
            <h2 class="text-xl font-semibold">Transaction Ledger</h2>
            <button
                class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
                + Add Transaction
            </button>
        </header>

        <!-- Full-Page Table Container -->
        <div class="p-6 max-w-7xl mx-auto w-full flex-1">
            <div class="bg-white p-6 rounded-xl border shadow-sm h-full">
                <div class="overflow-x-auto">
                    <table id="fullTransactionsTable" class="w-full text-left display">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-3">Date</th>
                                <th class="p-3">Description</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Account</th>
                                <th class="p-3">Amount</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data injected via DataTables AJAX -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function () {
            $('#fullTransactionsTable').DataTable({
                ajax: {
                    url: '/api/transactions',
                    error: function (xhr) {
                        console.error('Transactions API failed:', xhr.status, xhr.responseText);
                    }
                },
                pageLength: 15, // Show more rows on the dedicated page
                lengthMenu: [10, 15, 25, 50, 100], // Allow user to change pagination size
                searching: true, // Enable the global search bar
                ordering: true, // Enable column sorting
                order: [[0, 'desc']], // Default sort: Date descending
                columns: [
                    {
                        data: 'date',
                        render: function (data) {
                            return new Date(data).toLocaleDateString();
                        }
                    },
                    { data: 'merchant' },
                    { data: 'category' },
                    { data: 'account' }, // Added account column for deeper analytics
                    {
                        data: 'amount',
                        render: function (data) {
                            return '€' + parseFloat(data).toFixed(2);
                        }
                    },
                    {
                        data: 'status',
                        render: function (data) {
                            const colorClass = data === 'cleared' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                            return `<span class="px-2 py-1 rounded-full text-xs font-medium ${colorClass}">${data}</span>`;
                        }
                    }
                ]
            });
        });
    </script>
</body>

</html>
